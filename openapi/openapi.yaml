openapi: 3.0.0
x-stoplight:
  id: ojkqsc9c46a48
info:
  title: Policies
  version: main
  description: Create and manage policies that control user access to 
    infrastructure and cloud resources.
servers:
  - url: 'https://{tenant_subdomain}.uap.cyberark.cloud/api'
    description: Production API
    x-internal: false
    variables:
      tenant_subdomain:
        default: ''

  - url: https://virtserver.swaggerhub.com/CyberArk/uap-schema-api/main
    description: SwaggerHub API Auto Mocking
    x-internal: false
paths:
  /policies:
    post:
      summary: Create a policy
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - policyId
                properties:
                  policyId:
                    type: string
                    x-stoplight:
                      id: uodib5ow8rjbf
                    description: The unique identifier of the access policy
                    maxLength: 99
                    example: fg55dvba-4d5f-5712-8fda-da03cedvab10
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '401':
          description: Unauthorized
          headers:
            RateLimit-Limit:
              schema:
                type: integer
                format: int32
                minimum: 0
                maximum: 1000
              description: The number of allowed requests in the current period.
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          headers:
            RateLimit:
              schema:
                type: integer
                format: int32
                maximum: 1000
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: post-policies
      x-stoplight:
        id: qjickm14qnhsc
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPolicy'
            examples:
              Create AWS IAM policy:
                $ref: '#/components/examples/Create_aws_iam_policy'
              Create AWS IAM Identity Center policy:
                $ref: '#/components/examples/Create_aws_idc_policy'
              Create GCP polcy - organization level:
                $ref: '#/components/examples/Create_gcp_policy_org_level'
              Create GCP policy - folder level:
                $ref: '#/components/examples/Create_gcp_policy_folder_level'
              Create GCP policy - project level:
                $ref: '#/components/examples/Create_gcp_policy_project_level'
              Create Azure resource policy:
                $ref: '#/components/examples/Create_azure_resource_policy'
              Create Microsoft Entra ID policy - entire directory:
                $ref: '#/components/examples/Create_azure_entra_policy'
              Create Azure policy - management group scope:
                $ref: '#/components/examples/Create_azure_managementgroup_policy'
              Create Azure policy - subscription scope:
                $ref: '#/components/examples/Create_azure_subscription_policy'
              Create Azure policy - resource group scope:
                $ref: '#/components/examples/Create_azure_resourcegroup_policy'
              Create infrastructure policy - VM:
                $ref: '#/components/examples/Create_aws_vm_policy'
              Create Infrastructure policy - DB:
                $ref: '#/components/examples/Create_infra_db_policy'
              Create Azure Group policy:
                $ref: '#/components/examples/Create_azure_group_policy'

      security:
      - bearerAuth: []
    get:
      summary: Get policies
      tags: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                - nextToken
                - total
                properties:
                  results:
                    x-stoplight:
                      id: 4gznmmpwm6vt6
                    allOf:
                    - x-stoplight:
                        id: q6k81vbier14e
                      maxItems: 50
                      items:
                        $ref: '#/components/schemas/CommonAccessPolicy'
                    type: array
                    items:
                      type: object
                  nextToken:
                    type: string
                    x-stoplight:
                      id: uq6sd3tojycpm
                    description: 'The token from the previous API response.<br>To
                      retrieve the next N results, use  DS1_10;DS2_20.<br>This means
                      that the service will retrieve 10 results from DS_1 and 20 results
                      from DS_2.'
                  total:
                    type: integer
                    x-stoplight:
                      id: 2dhyh95hxutmi
                    description: Total number of access policies.
                    format: int32
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
      operationId: get-policies
      x-stoplight:
        id: qlq18osng9d6g
      parameters:
      - schema:
          type: string
          example: filter=(((policyTags eq 'a') or (policyTags eq 'b') or 
            (policyTags eq 'c')) and (identities contains 'identity1234') and 
            (targetCategory eq 'VM') and ((status eq 'suspend') or (status eq 
            'active')) and ((locationType eq 'Azure') or (locationType eq 
            'GCP')))
        in: query
        name: filter
        description: 'Filter query to retrieve access policies. Supported operations:
          eq (except Identities which supports only contains), or, and. If you want
          to query on the same field, use "or" condition. Use the "and" operation
          to filter on two fields or more. Supported field names: policyTags, identities,
          targetCategory, status, locationType.'
      - schema:
          type: number
          default: 10
          minimum: 0
          maximum: 50
          example: 10
        in: query
        name: limit
        description: The maximum number of access policies to return.<br>You can
          request up to 50 policies.
      - schema:
          type: string
        in: query
        name: sort
        description: The field name by which to sort the results.<br>Currently 
          results can be sorted  by "createdBy" only.
      - schema:
          type: string
        in: query
        name: nextToken
        description: 'The token from the previous API response.<br>To retrieve the
          next N results, use  DS1_10;DS2_20.<br>This means that the service will
          retrieve 10 results from DS_1 and 20 results from DS_2.'
      - schema:
          type: string
          example: '"access to production"'
          maxLength: 200
        in: query
        name: q
        description: Use this for a free text search on **policy name** and 
          **description**.
      security:
      - bearerAuth: []
  '/policies/{policyId}':
    delete:
      summary: Delete policy
      tags: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
      operationId: delete-policies
      x-stoplight:
        id: 5tpqdxg6sky7z
      parameters: []
      security:
      - bearerAuth: []
    put:
      summary: Edit policy
      description: Modifies an access policy.
      tags: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '401':
          description: Unauthorized
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: put-policies
      x-stoplight:
        id: owa821q91o03b
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPolicy'
            examples:
              Cloud console - Edit AWS IAM policy:
                $ref: '#/components/examples/Edit_aws_idc_policy'
              Cloud console - Edit AWS IAM Identity Center policy:
                value:
                  metadata:
                    policyId: fg55dvba-4d5f-5712-8fda-da03cedvab10
                    name: Access policy for Cosmos DB
                    description: string
                    status:
                      status: Active
                      statusCode: string
                      statusDescription: string
                      link: string
                    policyTags:
                    - string
                    timeFrame:
                      fromTime: '2019-08-24T14:15:22Z'
                      toTime: '2019-08-24T14:15:22Z'
                    createdBy:
                      user: string
                      time: '2019-08-24T14:15:22Z'
                    updatedBy:
                      user: string
                      time: '2019-08-24T14:15:22Z'
                    policyEntitlement:
                      targetCategory: 'VM, DB, Cloud Console'
                      locationType: 'AWS, GCP, Azure, FQDN/IP'
                      policyType: Recurring
                  principals:
                  - id: string
                    name: string
                    sourceDirectoryName: string
                    sourceDirectoryId: string
                    type: USER
                  delegationClassification: Restricted
                  conditions:
                    accessWindow:
                      timeZone: string
                      daysOfTheWeek: 0
                      fromHour: string
                      toHour: string
                    maxSessionDuration: 0
                    idleTime: 10
                  targets:
                    AWS:
                      regions:
                      - string
                      tags:
                      - key: string
                        value:
                        - string
                      vpcIds:
                      - string
                      accountIds:
                      - string
                  behavior:
                    connectAs:
                      ssh:
                        username: string
                      rdp:
                        localEphemeralUser:
                          assignGroups:
                          - string
                          enableEphemeralUserReconnect: false
              Cloud console - Edit Coogle Cloud policy:
                $ref: '#/components/examples/Edit_gcp_policy'
              Cloud console - Edit Azure resources policy:
                $ref: '#/components/examples/Edit_azure_resource_policy'
              Cloud console - Edit Microsoft Entra ID policy:
                $ref: '#/components/examples/Edit_azure_entra_policy'
              Infrastructure - Edit VM policy:
                $ref: '#/components/examples/Edit_aws_vm_policy'
      security:
      - bearerAuth: []
    get:
      summary: Get policy
      description: Returns the details about a specific access policy
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
              examples:
                Cloud console - Get AWS IAM policy:
                  $ref: '#/components/examples/Get_aws_iam_policy'
                Cloud console - Get AWS IAM Identity Center policy:
                  $ref: '#/components/examples/Get_aws_idc_policy'
                Cloud console - Get Google Cloud policy:
                  $ref: '#/components/examples/Get_gcp_policy'
                Cloud console - Get Azure resource policy:
                  $ref: '#/components/examples/Get_azure_resource_policy'
                Cloud console - Get Microsoft Entra ID policy:
                  $ref: '#/components/examples/Get_entra_policy'
                Infrastructure - Get VM policy:
                  $ref: '#/components/examples/Get_aws_vm_policy'
                Infrastructure - Get DB Policy:
                  $ref: '#/components/examples/Get_infra_db_policy'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '["https://uap.cyberark.cloud.com"]'
                maxLength: 100
                pattern: \w+
      operationId: get-policy
      x-stoplight:
        id: ijsqypjpawz4a
      parameters: []
      security:
      - bearerAuth: []
    parameters:
    - schema:
        type: string
        maxLength: 99
        minLength: 1
        format: uuid
      name: policyId
      in: path
      required: true
  '/policies/{policyId}/validate':
    parameters:
    - schema:
        type: string
      name: policyId
      in: path
      required: true
    post:
      summary: Validate policy
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    x-stoplight:
                      id: gxbsciamby573
                    enum:
                    - VALIDATING
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: validate-policy
      x-stoplight:
        id: 84ns7ev2dga45
      description: |-
        Triggers a policy validation.
        If the response is "Validating", then you need to call the Get policy API to check the final status.

        * Relevant for cloud console policies only.
      security:
      - bearerAuth: []
      x-internal: false
  /policies/indication:
    get:
      summary: Get service indication
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - is_service_active
                - tenant_id
                properties:
                  is_service_active:
                    type: boolean
                    x-stoplight:
                      id: twhxuc8drde7p
                    description: |-
                      Indicates whether or not the service is managed in the Administration space.
                      false: The service is not managed in UAP
                      true: The service is managed in UAP
                  tenant_id:
                    type: string
                    x-stoplight:
                      id: vo86ivrldkwqc
                    maxLength: 32
                    minLength: 32
                    pattern: \w+
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: policies-indication
      x-stoplight:
        id: 2blifsvnz8c69
      x-internal: true
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
        in: query
        name: serviceName
        description: 'The name of the service you are querying to determine if it
          is managed in UAP. Possible values - sca, sia'
        required: true
      - schema:
          type: string
        in: query
        name: tenantId
        description: Internal parameter that will be valid only when providing 
          internal token
      - schema:
          type: string
        in: query
        name: identityId
        description: Internal parameter that will be valid only when providing 
          internal token
    parameters: []
  /policies/migrate:
    post:
      summary: Migration Completion Update
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: post-policies-migrate
      x-stoplight:
        id: a5vq4nmh2agyl
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - serviceName
              properties:
                serviceName:
                  x-stoplight:
                    id: 8ur8zjx8xwmhn
                  description: 'The name of the service you are querying to determine
                    if the policy is managed in the Administration space. Possible
                    values - sca, sia'
                  enum:
                  - SCA
                  - SIA
      description: 'When the API is triggered, policy management in the Administration
        space (UAP) will be enables on the service and tenant level.'
      x-internal: true
  /policies/migrate/rollback:
    post:
      summary: Rollback Migration
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatus'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: post-policies-migrate-rollback
      x-stoplight:
        id: b91hvy86jzmrg
      x-internal: true
      description: API to rollback the transition of a standalone access policy 
        to UAP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - serviceName
              properties:
                serviceName:
                  x-stoplight:
                    id: 0vw8q0a695f13
                  enum:
                  - SCA
                  - SIA
                  description: 'The name of the service you are querying to determine
                    if it is managed in UAP. Possible values - sca, sia'
                soft:
                  type: boolean
                  x-stoplight:
                    id: ab1o29gmn4e0a
                  default: true
                  description: 'Set to false if you would like the rollback to delete
                    the synced policies. Default is true, meaning, UAP not delete
                    the policies, it just disabled for the service.'
        description: ''
      security:
      - bearerAuth: []
  /policies/migrate/validation:
    post:
      summary: Validate Policy Uniqueness
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/UniquenessValidationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: get-policies-migrate-validation
      x-stoplight:
        id: qyzudy57m67ue
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              properties:
                request:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/UniquenessValidationRequest'
      x-internal: true
      security:
      - bearerAuth: []
  /policies/sync:
    post:
      summary: Sync Policies
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/MigrationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: post-policies-sync
      x-stoplight:
        id: drcg99ohgc38w
      x-internal: true
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              properties:
                request:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/MigratedCommonAccessPolicy'
                dryRun:
                  type: boolean
                  x-stoplight:
                    id: dryrun-field-id
                  description: |
                    If true, performs a validation without persisting the policy
components:
  schemas:
    CommonAccessPolicy:
      type: object
      x-examples: {}
      description: Fields common to all access policies
      x-stoplight:
        id: vpngyqy9226cd
      properties:
        metadata:
          type: object
          required:
          - name
          - status
          - policyEntitlement
          properties:
            policyId:
              type: string
              minLength: 0
              maxLength: 99
              example: fg55dvba-4d5f-5712-8fda-da03cedvab10
              format: uuid
              description: The unique identifier of the access policy
            name:
              type: string
              description: A unique name for the access policy.
              maxLength: 200
              minLength: 1
              example: Access Policy for Cosmos DB
            description:
              type: string
